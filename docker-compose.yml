name: agenttrace
services:
  falkordb:
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    container_name: agenttrace-db
    # Bypass the upstream browser launcher, which ignores CMD arguments.
    entrypoint: ["redis-server"]
    # RDB snapshots avoid a reproduced GRAPH.EFFECT constraint replay crash in this image's AOF mode.
    command: ["--dir", "/data", "--loadmodule", "/var/lib/falkordb/bin/falkordb.so", "--appendonly", "no", "--save", "1 1", "--protected-mode", "no", "--requirepass", "${FALKORDB_PASSWORD:-}"]
    environment:
      REDISCLI_AUTH: ${FALKORDB_PASSWORD:-}
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["graph-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      EMBEDDED_WORKER: ${EMBEDDED_WORKER:-1}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["workspaces:/app/.runtime"]
    depends_on:
      falkordb: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
    command: ["python", "-m", "app.workers.runner", "--tenant", "demo", "--owner", "executor-container"]
    volumes: ["workspaces:/app/.runtime"]
    depends_on:
      falkordb: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  graph-data:
    name: agenttrace_data
  workspaces:
